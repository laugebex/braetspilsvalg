<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Brætspilsvalg</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Månedens brætspil</p>
        <h1>Brætspilsvalg</h1>
        <p id="poll-title" class="subtitle">Indlæser afstemning…</p>
        <p id="poll-date" class="date-line"></p>
      </div>
      <div id="voter-badge" class="voter-badge hidden"></div>
    </header>

    <nav class="tabs" aria-label="Navigation">
      <button class="tab active" data-tab="vote">Stem</button>
      <button class="tab" data-tab="results">Resultat</button>
      <button class="tab" data-tab="history">Historik & statistik</button>
    </nav>

    <section id="setup-warning" class="notice hidden"></section>

    <section id="vote" class="panel active-panel">
      <div class="card voter-card">
        <div class="section-label">Hvem er du?</div>
        <div id="voter-options" class="voter-options"></div>
      </div>
      <div id="progress"></div>
      <div id="vote-content"></div>
    </section>

    <section id="results" class="panel">
      <div id="results-content"></div>
    </section>

    <section id="history" class="panel">
      <div id="history-content"></div>
    </section>
  </main>
  <script src="/app.js" defer></script>
  <script src="/image-tools.js" defer></script>
  <script src="/image-guard.js" defer></script>
</body>
</html>
